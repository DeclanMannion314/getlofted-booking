<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Job - Get Lofted Property Services</title>
<link rel="stylesheet" href="styles.css">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Get Lofted">
<meta name="theme-color" content="#000000">
</head>
<body class="booking-page">

<div class="site-header">
  <a href="index.html" class="back-arrow" aria-label="Back">&larr;</a>
  <img src="logo.png" alt="Get Lofted Property Services" class="site-logo">
</div>

<h1>Book a Job</h1>
<p class="subtitle">Tell us about the job and we'll get back to you to confirm.</p>

<form id="bookingForm">
  <label for="name">Name</label>
  <input type="text" id="name" required>

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" required>

  <label for="address">Job Address</label>
  <input type="text" id="address" required>

  <label for="typeOfWork">Type of Work</label>
  <select id="typeOfWork" required>
    <option value="">Select...</option>
    <option value="Loft work">Loft work</option>
    <option value="Carpentry">Carpentry</option>
    <option value="Painting & decorating">Painting &amp; decorating</option>
    <option value="General repairs">General repairs</option>
    <option value="Other">Other</option>
  </select>

  <label for="description">Describe the Job</label>
  <textarea id="description" rows="4" required></textarea>

  <label for="urgency">How Urgent Is It?</label>
  <select id="urgency" required>
    <option value="">Select...</option>
    <option value="Flexible">Flexible</option>
    <option value="Within 2 weeks">Within 2 weeks</option>
    <option value="As soon as possible">As soon as possible</option>
  </select>

  <label for="preferredDate">Preferred Date (optional)</label>
  <input type="date" id="preferredDate">

  <button type="submit">Submit Request</button>
</form>

<div id="popupOverlay" class="popup-overlay" style="display:none;">
  <div class="popup-box">
    <div id="popupIcon" class="popup-icon"></div>
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>
document.getElementById('bookingForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    typeOfWork: document.getElementById('typeOfWork').value,
    description: document.getElementById('description').value,
    urgency: document.getElementById('urgency').value,
    preferredDate: document.getElementById('preferredDate').value
  };

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error('Something went wrong.');

    showPopup(true, 'Request Sent', "Thanks! We've received your request and will be in touch to confirm.");
    document.getElementById('bookingForm').reset();
  } catch (err) {
    showPopup(false, 'Something Went Wrong', 'Please try again, or call us directly.');
  }
});

function showPopup(success, title, text) {
  document.getElementById('popupIcon').textContent = success ? '✓' : '✕';
  document.getElementById('popupIcon').className = 'popup-icon ' + (success ? 'popup-success' : 'popup-error');
  document.getElementById('popupTitle').textContent = title;
  document.getElementById('popupText').textContent = text;
  document.getElementById('popupOverlay').style.display = 'flex';
}

function closePopup() {
  document.getElementById('popupOverlay').style.display = 'none';
}
</script>

</body>
</html>
